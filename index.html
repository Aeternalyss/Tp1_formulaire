<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="src/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tp1_formulaire</title>
</head>

<body class="">
  <h1 class="text-emerald-500 text-xl ">formulaire don</h1>
  <!-- formulaire -->
  <form action="" method="" class="">

    <!-- étape 1 -->
    <section class="etape">
      <h2 class="">Étape 1</h2>
      <fieldset>
        <legend>information sur le don</legend>
        <div>
          <input type="radio" name="type_don" id="1" value="1" required>
          <label for="1">Don unique</label>
        </div>
        <div>
          <input type="radio" name="type_don" id="2" value="2" required>
          <label for="2">Parainer un animal pour un an</label>
        </div>
        <div>
          <input type="radio" name="type_don" id="3" value="3" required>
          <label for="3">Offrir un parainage</label>
        </div>
        <div>
          <input type="radio" name="type_don" id="4" value="4" required>
          <label for="4">Parainage coopératif</label>
        </div>
        <span class="message-erreur">message erreur placeholder</span>
      </fieldset>
      <div class="">
        <label for="montant">Montant du don: </label>
        <input type="text" name="montant" id="montant" list="montant-recommander" placeholder="Choisisez le montant" required>
        <datalist id="montant-recommander">
          <option value="10"></option>
          <option value="25"></option>
          <option value="50"></option>
          <option value="75"></option>
          <option value="100"></option>
          <option value="150"></option>
        </datalist>
      </div>
    </section>
    <!-- étape 2 -->
    <section class="etape">
      <h2>Étape 2</h2>
      <fieldset>
        <legend>Coordonée</legend>
        <!-- résumer du don , option de supprimer -->

        <!-- nom,entreprise,adresse,courielle,valider -->
        <label for="">Nom </label>
        <input type="text" name="" id="" />
        <label for="">Prénom </label>
        <input type="text" name="" id="" />
        <label for="">courielle </label>
        <input type="text" name="" id="" required/>
        <span class="message-erreur">message erreur placeholder</span>
        Étape précédente
      </fieldset>
    </section>
    <!-- étape 3 -->
    <section class="etape">
      <h2>Étape 3</h2>
      <fieldset>
        <legend>information de paiement</legend>
        <!-- carte credit, num,expiration,validation -->
        <label for="">carte credit </label>
        <input type="card" name="" id="" required/>
        <label for="">numéro</label>
        <input type="text" name="" id="" required/>
        <label for=""> expiration required</label>
        <input type="text" name="" id="" />
        <span class="message-erreur">message erreur placeholder</span>
        Étape précédente

      </fieldset>
    </section>
    <!-- étape 4 -->
    <section class="etape">
      <h2>Étape 4</h2>
      <fieldset>
        <legend>résumer</legend>
        <!-- montant raison du don merci de participer a aider la faune bla bla bla -->
        <p>vous aller faire un don de 25$!</p>
      </fieldset>
      <button class="bg-emerald-400" type="submit" formaction="/merci.html">Submit form</button>
    </section>
    <button type="button" id="btn-precedent">
      Étape précédente
    </button>
    <button id="btn-suivant" type="button">Étape suivant</button>
  </form>

  <script type="module" src="src/main.ts"></script>

</body>

</html>
